databaseChangeLog:
  - changeSet:
      id: 3
      author: soboleoko
      changes:
        - createTable:
            tableName: visits
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: start_date
                  type: timestamp
                  constraints:
                    - nullable: false
              - column:
                  name: end_date
                  type: timestamp
                  constraints:
                    - nullable: false
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: institution_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: visits
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            constraintName: fk_visits_patient

        - addForeignKeyConstraint:
            baseTableName: visits
            baseColumnNames: doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
            constraintName: fk_visits_doctor

        - addForeignKeyConstraint:
            baseTableName: visits
            baseColumnNames: institution_id
            referencedTableName: institutions
            referencedColumnNames: id
            constraintName: fk_visits_institution